name: PHP Lint

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: |
          find . \( -path './backend/vendor' -o -path './release-build' -o -path './vendor' \) -prune -o -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
