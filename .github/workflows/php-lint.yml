name: PHP Lint and WordPress Plugin Checks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs

      - name: Install PHPCS and WordPress Coding Standards
        run: |
          export PATH="$HOME/.composer/vendor/bin:$PATH"
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress dealerdirect/phpcodesniffer-composer-installer:^1.0
          composer global require --no-interaction --no-progress squizlabs/php_codesniffer:^3.10
          composer global require --no-interaction --no-progress wp-coding-standards/wpcs:^3.0
          phpcs --config-set installed_paths "$HOME/.composer/vendor/wp-coding-standards/wpcs"

      - name: PHP syntax check
        run: |
          find . \( -path './backend/vendor' -o -path './release-build' -o -path './vendor' \) -prune -o -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done

      - name: WordPress coding standard check
        run: |
          phpcs --standard=WordPress --extensions=php --ignore='backend/**,release-build/**,**/vendor/**' .
