name: PHP Lint and WordPress Coding Standards

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  phpcs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHPCS + WordPress Coding Standards (dev only)
        run: |
          composer validate
          composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check (lint)
        run: |
          find . -path './backend/vendor' -prune -o -path './release-build' -prune -o -name '*.php' -print0 \
            | while IFS= read -r -d '' file; do php -l "$file"; done

      - name: WordPress coding standard check
        run: |
          if ! ./vendor/bin/phpcs --standard=WordPress --extensions=php \
            --ignore='backend/**,release-build/**,vendor/**,uninstall.php' .; then
            true
          fi

  build:
    name: Plugin zip
    needs: [ phpcs ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Build plugin zip
        run: |
          rsync -a \
            --include='sam-anti-spam.php' \
            --include='sam-sfw.php' \
            --include='uninstall.php' \
            --include='readme.txt' \
            --include='includes/***' \
            --include='assets/***' \
            --include='languages/***' \
            --exclude='*' \
            . /tmp/sam-anti-spam/
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp/sam-anti-spam
          zip -r "$GITHUB_WORKSPACE/dist/sam-anti-spam.zip" .

      - name: Upload plugin zip
        uses: actions/upload-artifact@v5
        with:
          name: sam-anti-spam-plugin
          path: dist/sam-anti-spam.zip
